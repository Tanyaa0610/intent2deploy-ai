services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODE=${LLM_MODE:-mock}
      - MODEL_NAME=${MODEL_NAME:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - VECTOR_STORE=chroma
      - CHROMA_PERSIST_DIR=/data/chroma_data
      - DATABASE_URL=sqlite:////data/intent2deploy.db
      - WORKSPACES_DIR=/data/workspaces
      - CLONED_REPOS_DIR=/data/cloned_repos
      - MAX_FILES_CHANGED=${MAX_FILES_CHANGED:-15}
      - MAX_PATCH_LINES=${MAX_PATCH_LINES:-1000}
      - MAX_REPAIR_ATTEMPTS=${MAX_REPAIR_ATTEMPTS:-2}
      - COMMAND_TIMEOUT_SECONDS=${COMMAND_TIMEOUT_SECONDS:-120}
    volumes:
      - i2d_data:/data
      - ./demo-repository:/demo-repository
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the static bundle at build time (see frontend/Dockerfile) —
        # the browser calls the backend directly on its host-published port,
        # not through Docker's internal network.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  i2d_data:
