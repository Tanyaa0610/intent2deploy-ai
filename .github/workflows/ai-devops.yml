name: AI-DevOps CI

on:
  push:
    branches: ["main", "intent2deploy/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend — lint, type-check, unit/integration/security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (Ruff)
        working-directory: backend
        run: ruff check app prompts

      - name: Run backend test suite (unit + integration + security)
        working-directory: backend
        env:
          LLM_MODE: mock
          LLM_PROVIDER: local
        run: pytest -q --junitxml=test-results.xml

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

      - name: Demo repository baseline test suite
        working-directory: demo-repository
        run: |
          pip install -r requirements.txt
          pytest -q

  frontend:
    name: Frontend — type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  evaluation:
    name: Evaluation benchmark (mock mode, non-blocking)
    runs-on: ubuntu-latest
    needs: backend
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install demo repository dependencies
        working-directory: demo-repository
        run: pip install -r requirements.txt

      - name: Run evaluation benchmark
        env:
          LLM_MODE: mock
          LLM_PROVIDER: local
        run: python scripts/run_evaluation.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/*.json
